[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smaran-pipecat"
version = "0.1.1"
description = "Smaran integration for Pipecat - memory-enhanced conversational AI pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ayush Panigrahi", email = "ayushpanigrahi84@gmail.com" }
]
keywords = [
    "smaran",
    "pipecat",
    "memory",
    "conversational-ai",
    "llm",
    "voice-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pipecat-ai>=1.0.0",
    "smaran>=0.1.0",
    "pydantic>=2.10.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.14.1",
    "black>=24.8.0",
    "isort>=5.13.2",
]

[project.urls]
Homepage = "https://github.com/Ayushpani/smaran"
Repository = "https://github.com/Ayushpani/smaran"

[tool.hatch.build.targets.wheel]
packages = ["src/smaran_pipecat"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
