[package]
name = "reranker-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM-compatible scoring utilities for the Smaran Edge Reranker"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.89"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.3"
js-sys = "0.3.66"
serde_json = "1.0"
wasm-math = { path = "../wasm-math" }

# Note: tract-onnx and tokenizers are native-only libraries and cannot compile
# to wasm32-unknown-unknown. ONNX inference is handled in the Cloudflare Worker
# via @huggingface/transformers (ONNX Runtime Web), not in Rust WASM.

[package.metadata.wasm-pack.profile.release]
# wasm-opt from wasm-pack's bundled Binaryen doesn't enable bulk-memory/SIMD
# features by default, causing validation failures. Rust's LTO + opt-level="s"
# is sufficient optimization without the post-processing step.
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
