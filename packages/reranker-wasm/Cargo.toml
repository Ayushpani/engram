[package]
name = "reranker-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM-compatible Cross-Encoder Reranker for SuperMemory"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.89"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.3"
js-sys = "0.3.66"
tract-onnx = "0.21.6" # Using tract as it's highly optimized and WASM-friendly
tokenizers = { version = "0.19.1", default-features = false } # Disable default features for WASM compatibility
serde_json = "1.0"
wasm-math = { path = "../wasm-math" }

[profile.release]
opt-level = "s"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = "abort"     # Abort on panic
strip = true        # Strip symbols from binary
