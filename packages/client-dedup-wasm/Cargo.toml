[package]
name = "client-dedup-wasm"
version = "0.1.0"
edition = "2021"
description = "Client-side WASM deduplication and semantic similarity engine for SuperMemory"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.89"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.3"
js-sys = "0.3.66"
tract-onnx = "0.21.6"
tokenizers = { version = "0.19.1", default-features = false }
wasm-math = { path = "../wasm-math" }

# getrandom must be explicitly enabled for wasm32-unknown-unknown targets.
[dependencies.getrandom]
version = "0.2"
features = ["js"]

[profile.release]
opt-level = "s"     # Size optimization is critical for browser payload
lto = true
codegen-units = 1
panic = "abort"
strip = true
