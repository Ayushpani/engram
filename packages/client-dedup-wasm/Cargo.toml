[package]
name = "client-dedup-wasm"
version = "0.1.0"
edition = "2021"
description = "Client-side WASM deduplication and semantic similarity engine for Engram"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.89"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.3"
js-sys = "0.3.66"
wasm-math = { path = "../wasm-math" }

# Note: tract-onnx and tokenizers are native-only libraries and cannot compile
# to wasm32-unknown-unknown. Embedding generation is handled server-side.

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
