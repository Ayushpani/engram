[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smaran"
version = "0.1.0"
description = "Python client for Smaran, voice-native memory infrastructure for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ayush Panigrahi", email = "ayushpanigrahi84@gmail.com" }
]
keywords = ["smaran", "memory", "ai", "agents", "voice-ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/Ayushpani/smaran"
Repository = "https://github.com/Ayushpani/smaran"

[tool.hatch.build.targets.wheel]
packages = ["src/smaran"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]
