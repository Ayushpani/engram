[package]
name = "memory-consolidator"
version = "0.1.0"
edition = "2021"
description = "Graph clustering and memory consolidation engine for SuperMemory"

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
wasm-bindgen = "0.2.89"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.3"
js-sys = "0.3.66"
petgraph = "0.6.4" # Graph data structures and algorithms
serde_json = "1.0"
wasm-math = { path = "../wasm-math" }

[profile.release]
opt-level = 3     # Optimize for speed (graph clustering is CPU bound)
lto = true
codegen-units = 1
panic = "abort"
strip = true
