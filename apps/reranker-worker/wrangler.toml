name = "smaran-edge-reranker"
main = "src/index.ts"
compatibility_date = "2024-05-20"

workers_dev = true

[placement]
mode = "smart"

[observability]
enabled = true

# Cloudflare Workers AI binding — gives the Worker access to
# GPU-accelerated ML models running on Cloudflare's network.
[ai]
binding = "AI"
