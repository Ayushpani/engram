name: Deploy Edge Reranker

on:
  push:
    branches:
      - main
    paths:
      - 'packages/reranker-wasm/**'
      - 'packages/client-dedup-wasm/**'
      - 'packages/wasm-math/**'
      - 'apps/reranker-worker/**'
      - '.github/workflows/deploy-reranker.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: bun install

      - name: Build WASM Math
        working-directory: packages/wasm-math
        run: wasm-pack build --target bundler --release

      - name: Build Reranker WASM Utilities
        working-directory: packages/reranker-wasm
        run: wasm-pack build --target bundler --release

      - name: Build Client Dedup WASM
        working-directory: packages/client-dedup-wasm
        run: wasm-pack build --target bundler --release

      - name: Deploy Cloudflare Worker
        working-directory: apps/reranker-worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
