name: Deploy Edge Reranker WASM

on:
  push:
    branches:
      - main
    paths:
      - 'packages/reranker-wasm/**'
      - 'apps/reranker-worker/**'
      - 'packages/edge-reranker/**'
      - '.github/workflows/deploy-reranker.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build WASM Math
        working-directory: packages/wasm-math
        run: wasm-pack build --target bundler --release

      - name: Build Reranker WASM
        working-directory: packages/reranker-wasm
        run: wasm-pack build --target bundler --release

      - name: Build Edge Reranker Wrapper
        working-directory: packages/edge-reranker
        run: bun run build

      - name: Deploy Cloudflare Worker
        working-directory: apps/reranker-worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
